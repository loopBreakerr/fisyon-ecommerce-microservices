services:
  # --------------------------------------------------------
  # POSTGRESQL - tek container, mikroservisler için ayrı database'ler
  # --------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: catalog_db,cart_db,order_db,payment_db,inventory_db,keycloak_db,notification_db,review_db,shipping_db,recommendation_db,user_profile_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh
    networks:
      - backend

  # --------------------------------------------------------
  # REDIS - session cache
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  # --------------------------------------------------------
  # ELASTICSEARCH - Search Service'in veri kaynağı
  # --------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - backend

  # --------------------------------------------------------
  # KIBANA - Elasticsearch görselleştirme / yönetim arayüzü
  # --------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.5
    container_name: kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - backend

  # --------------------------------------------------------
  # KAFKA - event streaming (KRaft modu, Zookeeper'sız)
  # --------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: always
    environment:
      # KRaft modu ayarları - Kafka'nın kendi kendini koordine etmesi için
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # tek broker olduğu için replication factor 1 (production'da genelde 3 olur)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend

  # --------------------------------------------------------
  # KAFKA UI - topic/mesaj/consumer group'ları görsel izlemek için
  # --------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    networks:
      - backend

  # --------------------------------------------------------
  # KEYCLOAK - kimlik doğrulama / authorization
  # --------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    restart: always
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - backend

# --------------------------------------------------------
# NAMED VOLUMES - container silinse bile veri kalıcı olsun
# --------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  es_data:
  kafka_data:

# --------------------------------------------------------
# NETWORK - tüm servisler aynı ağda, birbirini servis ismiyle bulur
# --------------------------------------------------------
networks:
  backend:
    driver: bridge
