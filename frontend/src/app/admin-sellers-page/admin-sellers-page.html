<h2>Satıcılar</h2>

<p-button label="Yenile" (click)="loadSellers()" severity="secondary" [outlined]="true" />

@if (message()) {
<p>{{ message() }}</p>
}

@if (loading()) {
<p>Yükleniyor...</p>
} @else if (sellers().length === 0) {
<p>Hiç satıcı yok</p>
} @else {
<p-table [value]="sellers()">
  <ng-template #header>
    <tr>
      <th>ID</th>
      <th>Kullanıcı Adı</th>
      <th>E-posta</th>
    </tr>
  </ng-template>
  <ng-template #body let-seller>
    <tr>
      <td>{{ seller.id }}</td>
      <td>{{ seller.username }}</td>
      <td>{{ seller.email }}</td>
    </tr>
  </ng-template>
</p-table>
}
